# Two runtimes and the services the project expects.
#
# Kiln 0.1.0 parses [services] and reports it, but does not start anything.
# The runtimes above it are managed normally.

[project]
name = "fullstack"
version = "2.4.0"
description = "A JavaScript front end, a Python API, and their datastores."

[runtime]
node = "22.14.0"
# The release line, not an exact patch. python-build-standalone publishes only
# the newest patch of each line, so `3.13.5` stops resolving the day 3.13.6
# ships. The exact version is pinned in kiln.lock either way, which is where
# reproducibility actually comes from.
python = "3.13"

[environment]
NODE_ENV = "development"
DATABASE_URL = "postgres://localhost:5432/fullstack"
REDIS_URL = "redis://localhost:6379"

[commands]
dev = "npm run dev"
api = "python -m uvicorn api.main:app"
test = "npm test"
"test:api" = "python -m pytest"

[services]
postgres = "17"
redis = "7"
